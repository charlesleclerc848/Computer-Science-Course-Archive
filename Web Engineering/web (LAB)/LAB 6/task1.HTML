<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <div class="container">
     <h1 class="display-2">Student Detail Form</h1>
     <div id ="form-container" style="height: 30vh;">
    <form action="">
        <label for="name">Student Name</label>
        <input type="text" id="name">
        <label for="sap">Sap Id</label>
        <input type="text" id="sap">
        <label for="con">Contact</label>
        <input type="text" id="contact">
        <label for="cgpa">CGPA</label>
        <input type="number" id="cgpa">

        <button type="button" onclick="addrow() ; event.preventDefault();" class="btn btn-primary">Add row</button>
    </form>
     </div>
        <table class="table table-bordered" id="show">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Sap ID</th>
                    <th>Contact</th>
                    <th>CGPA</th>
                </tr>
            </thead>
        </table> 
    </div>

    <script>
        let n =1 ;
        let name,sap,contact,cgpa;
        function addrow(){
            
            let table= document.getElementById("show");
            let name= document.getElementById("name").value;
            let sap= document.getElementById("sap").value;
            let contact= document.getElementById("contact").value;
            let cgpa= document.getElementById("cgpa").value;
            let row= table.insertRow(n);
            row.insertCell(0).innerHTML=name;
            row.insertCell(1).innerHTML=sap;
            row.insertCell(2).innerHTML=contact;
            row.insertCell(3).innerHTML=cgpa;
            n++;
     
        }
    </script>
    
</body>
</html>
