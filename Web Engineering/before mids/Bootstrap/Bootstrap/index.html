<h1 class="display-2">Grids in Bootstrap</h1>
<p class="lead">Basic grid</p>
<div class="container">
    <div class="row">
        <div class="col">
            <div class="bg-primary text-light p-2">Col 1</div>
        </div>
        <div class="col">
            <div class="bg-primary text-light p-2">Col 2</div>
        </div>
        <div class="col">
            <div class="bg-primary text-light p-2">Col 3</div>
        </div>
    </div>
</div>
<p class="lead">different colunms grid</p>
<div class="container">
    <div class="row">
        <div class="col-6">
            <div class="bg-primary text-light p-2">Col 1</div>
        </div>
        <div class="col-3">
            <div class="bg-primary text-light p-2">Col 2</div>
        </div>
        <div class="col-3">
            <div class="bg-primary text-light p-2">Col 3</div>
        </div>
    </div>
</div>
<p class="lead">responsive colunms grid</p>
<div class="container">
    <div class="row gy-1">
        <div class="col-sm-4 col-lg-5">
            <div class="bg-primary text-light p-2">Col 1</div>

        <div class="col-sm-4 col-lg-3">

        </div>
        <div class="col-sm-4 col-lg-4">
            <div class="bg-primary text-light p-2">Col 3</div>
